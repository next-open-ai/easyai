name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (uses packageManager-pinned pnpm)
        run: corepack enable
      - name: Verify pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build workspace
        run: pnpm build
      - name: Check bundle sizes
        run: pnpm size:check

  web-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (uses packageManager-pinned pnpm)
        run: corepack enable
      - name: Verify pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Prepare smoke secrets
        run: |
          mkdir -p .tmp
          cat > .tmp/smoke-secrets.json <<'EOF'
          {
            "model": {
              "providerInstances": [
                {
                  "id": "smoke-ollama",
                  "type": "ollama",
                  "name": "Smoke Ollama",
                  "baseUrl": "http://127.0.0.1:11434"
                }
              ],
              "models": [
                {
                  "id": "smoke-model",
                  "providerInstanceId": "smoke-ollama",
                  "chatModel": "smoke"
                }
              ],
              "activeChatModelId": "smoke-model"
            },
            "search": {
              "version": 1,
              "defaultProvider": "auto",
              "providers": []
            }
          }
          EOF
      - name: Start web runtime
        shell: bash
        run: |
          mkdir -p .tmp/smoke-data
          EASYAI_ORCH_RUNNER=memory-approval \
          EASYAI_DATA_DIR="$PWD/.tmp/smoke-data" \
          EASYAI_SECRETS_FILE="$PWD/.tmp/smoke-secrets.json" \
          EASYAI_WEB_STATIC_DIR="$PWD/apps/renderer/dist" \
          node apps/api/dist/main.cjs > .tmp/web-runtime.log 2>&1 &
          echo $! > .tmp/web-runtime.pid
      - name: Wait for API health
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4318/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .tmp/web-runtime.log
          exit 1
      - name: Verify web index is served
        run: curl -fsS http://127.0.0.1:4318/ > /tmp/easyai-index.html
      - name: Run orchestration smoke
        run: node scripts/headless-gateway-smoke.mjs
      - name: Stop web runtime
        if: always()
        shell: bash
        run: |
          if [ -f .tmp/web-runtime.pid ]; then
            kill "$(cat .tmp/web-runtime.pid)" || true
          fi
      - name: Print web runtime log on failure
        if: failure()
        run: cat .tmp/web-runtime.log

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (uses packageManager-pinned pnpm)
        run: corepack enable
      - name: Verify pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Validate root Dockerfile build
        run: docker build --tag easyai-ci:${{ github.sha }} .

  desktop-package-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
            expected_extension: dmg
          - os: windows-latest
            artifact: windows-x64
            expected_extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (uses packageManager-pinned pnpm)
        run: corepack enable
      - name: Verify pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package desktop app
        run: pnpm package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify packaged installer
        shell: bash
        run: |
          find apps/desktop/release -type f -name "*.${{ matrix.expected_extension }}" -print -quit | grep -q .
